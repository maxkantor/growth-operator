name: Daily Growth Operator

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-growth-operator
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest discover -s tests

      - name: Audit portfolio
        id: audit
        continue-on-error: true
        run: python src/growth_operator.py

      - name: Commit latest report
        run: |
          if git diff --quiet -- reports/latest.md reports/today.json; then
            exit 0
          fi
          git config user.name "growth-operator[bot]"
          git config user.email "growth-operator[bot]@users.noreply.github.com"
          git add reports/latest.md reports/today.json
          git commit -m "Update daily growth report"
          git push

      - name: Create daily growth action issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          action_date=$(python -c "import json; print(json.load(open('reports/today.json'))['date'])")
          title="Growth actions ${action_date}"
          existing=$(gh issue list --state all --search "${title} in:title" --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            exit 0
          fi
          python - <<'PY'
          import json
          data = json.load(open('reports/today.json'))
          lines = [f"# Growth actions for {data['date']}", ""]
          for item in data['experiments']:
              lines.extend([
                  f"## {item['product']} — {item['id']}", "",
                  f"**Action:** {item['action']}", "",
                  f"**Metric:** {item['metric']}",
                  f"**Target:** {item['target']}",
                  f"**Guardrail:** {item['guardrail']}",
                  f"**Duration:** {item['duration']}",
                  f"**Stop rule:** {item['stop_rule']}", "",
              ])
          open('/tmp/growth-action.md', 'w').write('\n'.join(lines))
          PY
          gh issue create --title "$title" --body-file /tmp/growth-action.md

      - name: Open availability issue
        if: steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --state open --search 'Production site unavailable in:title' --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            gh issue create --title "Production site unavailable" --body "The daily audit detected at least one unavailable production site. Review reports/latest.md and the workflow log."
          fi

      - name: Fail after reporting outage
        if: steps.audit.outcome == 'failure'
        run: exit 1
